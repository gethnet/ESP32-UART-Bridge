; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = ESP32 UART Bridge
name = esp32-uart-bridge
default_envs = zero_production

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
framework = 
	arduino
	espidf
board = esp32-s3-devkitm-1
board_build.cmake_extra_args = 
	-DIDF_COMPONENT_MANAGER=0
board_build.embed_txtfiles = 
	managed_components/espressif__esp_insights/server_certs/https_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 3276800
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = partitions_custom_4mb.csv
lib_deps = 
	bblanchon/ArduinoJson@^7.4.2
	fastled/FastLED@^3.10.3
	arkhipenko/TaskScheduler@^4.0.3
	ESP32Async/ESPAsyncWebServer@3.10.0
	ESP32Async/AsyncTCP@3.4.10
build_flags = 
	-D CONFIG_LITTLEFS_SPIFFS_COMPAT=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-D USE_UART_DMA=1
	-D CONFIG_ARDUINO_EVENT_RUNNING_CORE=1
	-D CONFIG_ESP32_EVENT_TASK_STACK_SIZE=4096
	-D CONFIG_ASYNC_TCP_STACK_SIZE=8192
	-Wno-deprecated-declarations
	-Wno-error=deprecated-declarations
	-Isrc/protocols
	-DMAVLINK_USE_CONVENIENCE_FUNCTIONS
monitor_speed = 115200
upload_speed = 921600
extra_scripts = 
	pre:scripts/embed_html.py
	pre:scripts/copy_sdkconfig.py
	pre:scripts/update_readme_version.py

[env:zero_production]
build_flags = 
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=0
	-D BOARD_ESP32_S3_ZERO
board_build.bootloader_log_level = none
monitor_filters = direct

[env:zero_debug]
build_flags = 
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=2
	-D BOARD_ESP32_S3_ZERO
lib_ignore = ESP_SR
board_build.bootloader_log_level = none
monitor_filters = 
	esp32_exception_decoder
	direct
build_type = debug

[env:zero_ble_production]
build_flags = 
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=0
	-D BOARD_ESP32_S3_ZERO
	-D BLE_ENABLED
	'-DMODLOG_1(level, ...)='
board_build.bootloader_log_level = none
monitor_filters = direct

[env:zero_ble_debug]
build_flags = 
	${env.build_flags}
	-D CORE_DEBUG_LEVEL=2
	-D BOARD_ESP32_S3_ZERO
	-D BLE_ENABLED
	'-DMODLOG_1(level, ...)='
lib_ignore = ESP_SR
board_build.bootloader_log_level = none
monitor_filters = 
	esp32_exception_decoder
	direct
build_type = debug

[env:supermini_production]
extends = env:zero_production
build_flags = 
	${env:zero_production.build_flags}
	-UBOARD_ESP32_S3_ZERO
	-D BOARD_ESP32_S3_SUPER_MINI

